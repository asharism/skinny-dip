<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skinny Dip editor</title>
<style>
  :root {
    --fg: #2b2b2b;
    --muted: #67625c;
    --cursor: #a84d26;
    --selection: #f0ddd2;
    --marker: #8f8a84;
    --editor-font-size: 13px;
    --editor-inline-pad: 22px;
  }
  html, body, #editor { margin: 0; height: 100%; background: transparent; color: var(--fg); }
  .cm-editor, .cm-scroller, .cm-gutters { background: transparent !important; }
  .cm-editor.cm-focused { outline: none; }
  .cm-content::spelling-error { text-decoration: underline wavy #ff3b30; }
  .cm-placeholder { color: var(--muted); }
</style>
</head>
<body>
<div id="editor"></div>
<script src="editor.bundle.js"></script>
</body>
</html>
