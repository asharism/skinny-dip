name: SkinnyDip
options:
  bundleIdPrefix: com.hitesh
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  MarkdownCore:
    path: Packages/MarkdownCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SkinnyDip:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: SkinnyDip
        excludes:
          - Editor/web/**
      - path: SkinnyDip/Resources
        type: folder
        buildPhase: resources
    dependencies:
      - package: MarkdownCore
      - package: Sparkle
        platformFilters: [macOS]
    settings:
      base:
        # The app is "Skinny"; the bundle ID, target and Swift module keep the
        # SkinnyDip name so the sandbox container (Scratch Documents) carries over.
        PRODUCT_NAME: Skinny
        PRODUCT_MODULE_NAME: SkinnyDip
        PRODUCT_BUNDLE_IDENTIFIER: com.hitesh.SkinnyDip
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Skinny
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ad-hoc signed (no Developer ID): Hardened Runtime's library validation
        # would refuse to load Sparkle. scripts/release.sh turns it on when it
        # signs with a Developer ID and notarizes.
        ENABLE_HARDENED_RUNTIME: NO
        # XcodeGen gives the multiplatform target the iOS rpath; a Mac app keeps
        # embedded frameworks (Sparkle) in Contents/Frameworks.
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: SkinnyDip/SkinnyDip.entitlements
        ENABLE_USER_SELECTED_FILES: readwrite
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
    info:
      path: SkinnyDip/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes: [net.daringfireball.markdown]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
              public.mime-type: [text/markdown]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: true
        NSMicrophoneUsageDescription: Skinny uses the microphone so you can dictate into the editor.
        NSSpeechRecognitionUsageDescription: Skinny uses speech recognition for dictation in the editor.
        # Sparkle auto-update from GitHub Releases (ADR-0009).
        SUFeedURL: https://github.com/asharism/skinny-dip/releases/latest/download/appcast.xml
        SUPublicEDKey: u/lEp3eAIZaBcZ1HmwcId7frODa1SW0nusbVgh1ScPA=
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400

  # Hosted in the app so tests reach app-target code (clipboard, settings) with
  # @testable import. Mac only for now.
  SkinnyDipTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SkinnyDipTests
    dependencies:
      - target: SkinnyDip
      - package: MarkdownCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitesh.SkinnyDipTests
        GENERATE_INFOPLIST_FILE: YES
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        # XcodeGen derives an iOS-style path from the multiplatform app target.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Skinny.app/Contents/MacOS/Skinny
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  SkinnyDip:
    build:
      targets:
        SkinnyDip: all
    test:
      targets:
        - package: MarkdownCore/MarkdownCoreTests
        - SkinnyDipTests
