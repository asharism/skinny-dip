name: SkinnyDip
options:
  bundleIdPrefix: com.hitesh
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  MarkdownCore:
    path: Packages/MarkdownCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SkinnyDip:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: SkinnyDip
    dependencies:
      - package: MarkdownCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitesh.SkinnyDip
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Skinny Dip
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
    info:
      path: SkinnyDip/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes: [net.daringfireball.markdown]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
              public.mime-type: [text/markdown]
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: true

  # Hosted in the app so tests reach app-target code (clipboard, settings) with
  # @testable import. Mac only for now.
  SkinnyDipTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SkinnyDipTests
    dependencies:
      - target: SkinnyDip
      - package: MarkdownCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitesh.SkinnyDipTests
        GENERATE_INFOPLIST_FILE: YES
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        # XcodeGen derives an iOS-style path from the multiplatform app target.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SkinnyDip.app/Contents/MacOS/SkinnyDip
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  SkinnyDip:
    build:
      targets:
        SkinnyDip: all
    test:
      targets:
        - package: MarkdownCore/MarkdownCoreTests
        - SkinnyDipTests
