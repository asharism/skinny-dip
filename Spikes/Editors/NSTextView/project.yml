name: NSTextViewSpike
options:
  bundleIdPrefix: com.hitesh.SkinnyDip.spike
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  NSTextViewSpike:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: ../Shared
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitesh.SkinnyDip.spike.nstextview
        PRODUCT_NAME: NSTextViewSpike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NSTextView Spike
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
